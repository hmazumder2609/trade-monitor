services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trade-monitor:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Terminal sub-app (blmtrm) — runs alongside the dashboard in development
  terminal:
    image: node:22-alpine
    working_dir: /app/src/terminal
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/src/terminal/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - VITE_DASHBOARD_URL=http://localhost:5173
    profiles:
      - dev

  # Development variant — hot-reloads server on file changes
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:full"
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    profiles:
      - dev
